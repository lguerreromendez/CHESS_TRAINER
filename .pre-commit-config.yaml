repos:
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--ignore=E203,E501,F401,E722,F541"]
  # NOTE: pytest is not run as a pre-commit hook here to avoid environment
  # isolation issues; run tests locally with `venv\Scripts\python -m pytest`.